name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（API 最小栈 + 测试工具；不含 torch/streamlit 大件）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest httpx

      - name: 语法编译检查（所有核心模块）
        run: |
          python -m py_compile rag_core.py rag_search_utils.py reranker.py \
            app.py main.py api_schemas.py config.py health.py query_log.py \
            eval_data.py eval_local.py run_ab.py \
            eval_data_heldout.py grounding.py backup_index.py eval_heldout.py \
            api_security.py ingest_ocr.py mcp_server.py

      - name: 核心算法单测（零外部依赖）
        run: python test_core.py

      - name: API 端点测试（mock 外部依赖，无需 Ollama）
        run: python -m pytest test_api.py test_api_papers.py -v

      - name: 论文管线单测（normalize / chunker / citation，零外部依赖）
        run: python -m pytest test_paper_normalize.py test_paper_chunk.py test_paper_citation.py -v

      - name: profile 默认值契约（子进程，零外部依赖）
        run: python -m pytest test_config_profile.py -v

      - name: MCP 协议测试（零依赖协议用例，检索冒烟无 Ollama 自动 skip）
        run: python -m pytest test_mcp.py -v

      - name: 检索冒烟测试（需 Ollama，CI 环境自动 skip）
        run: python -m pytest test_retrieval.py -v

  # 镜像构建门禁：确保 Dockerfile 始终可构建（只 build 不 push，不消耗 registry 配额）。
  # 与 test 并行跑；slim 模式不含 torch，构建通常在 2 分钟内完成。
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 构建 slim 镜像（默认模式，无 reranker）
        run: docker build -t courserag-api:ci .

      - name: 冒烟：容器能启动并响应 /health
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e OLLAMA_BASE_URL=http://127.0.0.1:11434 courserag-api:ci
          # 容器内无 Ollama，/health 应返回 200 且明确报告 Ollama 不可达（服务不崩）
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8000/health && break || sleep 2
          done
          curl -fs http://127.0.0.1:8000/health | grep -q '"vector_store_count"'
          docker logs smoke
          docker rm -f smoke
