# ============================================================
# CourseRAG 一键部署：API 服务（FastAPI）直连【宿主】Ollama
#
# 为什么直连宿主 Ollama（2026-08-22 改版）：
#   - 宿主已装 Ollama 且模型齐全（默认 bge-m3 / llama3.1:8b；云端模式见 .env），
#     容器内再拉一套要重新下载 ~5GB 模型，纯浪费
#   - 端口无冲突：不占宿主 11434（compose 不再映射 ollama 服务）
#   - API 容器是无状态"壳"，模型/数据全在宿主，镜像小、易换模型
#
# 前置条件：
#   - 宿主 Ollama 已启动（ollama serve）且模型已拉取
#   - Windows Docker Desktop：容器经 host.docker.internal 访问宿主
#     （Linux 用 network_mode: host 或把 127.0.0.1 换成宿主 IP）
#   - 若宿主 Ollama 只监听 127.0.0.1 导致容器连不上：
#     设 OLLAMA_HOST=0.0.0.0:11434 重启 Ollama（注意局域网暴露风险）
#
# 用法：
#   # 默认 slim：轻量（无 reranker，精确模式=向量+BM25 混合），端口 8000
#   docker compose up -d --build
#   # 完整版（含 bge-reranker 精排，镜像 +~2GB，首次需下载权重 ~2.2GB），端口 8001
#   docker compose --profile full up -d --build
#   验证：curl http://localhost:8000/health  （slim）
#        curl http://localhost:8001/health  （full）
# ============================================================
services:
  # ===== 默认 slim（无 reranker）：镜像小、启动快 =====
  # 精确模式 = 向量+BM25 混合（无 bge 精排）；需要精排请用 --profile full
  api:
    build:
      context: .
      args:
        WITH_RERANKER: "false"
    container_name: coursrag-api
    environment:
      # 直连宿主 Ollama（Windows Docker Desktop 用 host.docker.internal）
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # 默认全本地（宿主 Ollama bge-m3 + llama3.1:8b）；在 .env 里改
      # LLM_PROVIDER=openai / JUDGE_PROVIDER=openai 即可切云端，key 由下面透传。
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-local}
      JUDGE_MODEL: ${JUDGE_MODEL:-qwen2.5:7b}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      # slim 镜像未装 torch/sentence-transformers → 容器内不启用 reranker
      RERANKER_ENABLED: "false"
      HF_ENDPOINT: https://hf-mirror.com
      DATA_DIR: /app/data
      PERSIST_DIRECTORY: /app/chroma_db_m3
      QUERY_LOG_PATH: /app/.query_log.jsonl
    volumes:
      - ./data:/app/data              # 课程资料（挂宿主目录，方便增删）
      - ./chroma_db_m3:/app/chroma_db_m3    # 当前 bge-m3 向量库
    ports:
      - "8000:8000"                   # API 端口（Swagger UI: http://localhost:8000/docs）
    restart: unless-stopped

  # ===== 完整版（profile: full）：含 bge-reranker 精排 =====
  # 用法：docker compose --profile full up -d --build
  api-full:
    profiles: ["full"]
    build:
      context: .
      args:
        WITH_RERANKER: "true"
    container_name: coursrag-api-full
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # 默认全本地（宿主 Ollama bge-m3 + llama3.1:8b）；在 .env 里改
      # LLM_PROVIDER=openai / JUDGE_PROVIDER=openai 即可切云端，key 由下面透传。
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-local}
      JUDGE_MODEL: ${JUDGE_MODEL:-qwen2.5:7b}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      # 完整版镜像已装 torch → 容器内开启 reranker（精确模式=向量+BM25+精排）
      RERANKER_ENABLED: "true"
      HF_ENDPOINT: https://hf-mirror.com
      DATA_DIR: /app/data
      PERSIST_DIRECTORY: /app/chroma_db_m3
      QUERY_LOG_PATH: /app/.query_log.jsonl
    volumes:
      - ./data:/app/data
      - ./chroma_db_m3:/app/chroma_db_m3
      # reranker 权重缓存卷：宿主机已下载过 bge-reranker-v2-m3 时复用，免二次下载
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8001:8000"                   # 与 slim 版 8000 区分
    restart: unless-stopped

volumes:
  huggingface_cache:
